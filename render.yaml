services:
  # ─── BACKEND API SERVICE ───
  - type: web
    name: creator11-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_API_KEY
        value: c11_bot_mgr_sec_9938a7fbc21d49e
      - key: FRONTEND_URL
        fromService:
          type: web
          name: creator11-frontend
          property: host

  # ─── FRONTEND NEXT.JS WEB APP ───
  - type: web
    name: creator11-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: creator11-backend
          property: host

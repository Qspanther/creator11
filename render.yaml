services:
  # ─── BACKEND API SERVICE ───
  - type: web
    name: creator11-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_API_KEY
        value: c11_bot_mgr_sec_9938a7fbc21d49e

  # ─── FRONTEND NEXT.JS WEB APP ───
  - type: web
    name: creator11-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://creator11-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://creator11-backend.onrender.com
